<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient</title>
<style>
:root{color-scheme:dark;--fg:#f5f5f7;--muted:#92929a;--glass:rgba(255,255,255,.075)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--fg);background:radial-gradient(ellipse at 15% 10%,#343b55 0%,transparent 45%),radial-gradient(ellipse at 90% 85%,#312c47 0%,transparent 40%),linear-gradient(145deg,#08090d,#11121a 55%,#07080b);display:flex;align-items:center;justify-content:center}
main{width:min(100vw,100vh * 1.75);height:100%;max-height:100vh;padding:5.5% 7%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.clockwrap{text-align:center;margin:auto 0}.clock{font-size:clamp(64px,16vw,142px);font-weight:200;letter-spacing:-.075em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 40px rgba(255,255,255,.07)}
.date{margin-top:16px;color:#c4c4cd;font-size:clamp(13px,3vw,18px);font-weight:400;letter-spacing:.015em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.09);border-radius:23px;padding:18px 20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 10px 40px rgba(0,0,0,.15)}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#aaaab4;margin-bottom:10px}
.days{font-size:clamp(30px,8vw,50px);font-weight:300;letter-spacing:-.045em;line-height:1}.sub{color:var(--muted);font-size:12px;margin-top:8px}
.media{display:flex;align-items:center;gap:15px}.disc{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#5b647d,#272b38);display:grid;place-items:center;color:#d8dbe5;font-size:18px}
.track{flex:1;min-width:0}.trackname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);font-size:12px;margin-top:4px}
.controls{display:flex;align-items:center;gap:16px;color:#e7e7ec;font-size:17px}.play{width:34px;height:34px;border-radius:50%;background:#f5f5f7;color:#17171a;display:grid;place-items:center;font-size:14px}
.footer{text-align:center;color:#73737e;font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-top:14px}
@media(max-width:420px){main{padding:6%}.cards{gap:9px}.card{padding:15px;border-radius:19px}.media{gap:10px}.controls{gap:11px}}
</style>
</head>
<body><main>
<div class="top"><span>Ambient</span><span id="weekday"></span></div>
<div class="clockwrap"><div class="clock" id="clock">00:00</div><div class="date" id="date"></div></div>
<div class="cards">
<div class="card"><div class="label">JEE Main · Countdown</div><div class="days" id="count">--</div><div class="sub">20 January 2027</div></div>
<div class="card"><div class="label">Now playing</div><div class="media"><div class="disc">♫</div><div class="track"><div class="trackname">Music</div><div class="artist">Media controls</div></div><div class="controls"><span>‹‹</span><span class="play">▶</span><span>››</span></div></div></div>
</div><div class="footer">Focus on what matters</div>
</main>
<script>
function update(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}).replace(' AM','').replace(' PM','');document.getElementById('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('weekday').textContent=n.toLocaleDateString(undefined,{weekday:'long'});const target=new Date(2027,0,20);target.setHours(0,0,0,0);const today=new Date(n);today.setHours(0,0,0,0);document.getElementById('count').textContent=Math.max(0,Math.ceil((target-today)/86400000))+' days';}
update();setInterval(update,1000);
</script></body></html>
